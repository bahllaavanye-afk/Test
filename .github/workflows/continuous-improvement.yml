name: Continuous Improvement — Autonomous Code Quality (CTO OKR ≥50 commits/day)

on:
  # Event-driven autonomy: GitHub cron is starved in this repo (see
  # CONTINUITY.md 2026-07-06), so ride CI completions — they fire constantly.
  # The concurrency group below is the rate limit: max one active + one queued.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    # Every 30 minutes — 48 runs/day × 3 commits each = 144+ commits/day toward CTO OKR
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      n_files:
        description: "Number of files to improve per run (1-5)"
        required: false
        default: "3"

concurrency:
  group: continuous-improvement
  cancel-in-progress: false

jobs:
  improve:
    name: Gemini improves files and opens a reward-gated PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
      # `gh workflow run` posts to /actions/workflows/{id}/dispatches, which
      # requires actions:write. Without it the dispatch below returned
      # "HTTP 403: Resource not accessible by integration" on EVERY run since it
      # was written — and `continue-on-error: true` reported the step as a
      # success, so nothing ever surfaced. That dispatch is the only thing that
      # gives an improver PR a CI run, which is why "the improver PRs bypass CI
      # so main can silently break" kept being true.
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests

      - name: Configure git
        run: |
          git config user.email "ai-improver@quantedge.ai"
          git config user.name "QuantEdge Continuous Improver"

      - name: Run continuous improver
        continue-on-error: true
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY_1 }}
          # Paid backstop: free-tier keys rate-limit silently; ai-pr-review proved
          # these work. Without them every conversation dies quiet (Discord silence).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY_1 }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY_1 }}
          DEEPSEEK_API_KEY_2: ${{ secrets.DEEPSEEK_API_KEY_2 }}
          DEEPSEEK_API_KEY_3: ${{ secrets.DEEPSEEK_API_KEY_3 }}
          SAMBANOVA_API_KEY:  ${{ secrets.SAMBANOVA_API_KEY_1 }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY_1 }}
          HYPERBOLIC_API_KEY: ${{ secrets.HYPERBOLIC_API_KEY_1 }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_AGENTS_API_KEYS: ${{ secrets.NVIDIA_AGENTS_API_KEYS }}
          TOGETHER_API_KEY:   ${{ secrets.TOGETHER_API_KEY_1 }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:            ${{ github.repository }}
          ALLOW_PAID_APIS:    "False"
          N_FILES:            ${{ github.event.inputs.n_files || '5' }}
          PYTHONPATH:         ${{ github.workspace }}/backend
        run: python .github/scripts/continuous_improver.py

      # NOTE: the script now pushes a throwaway `improver/run-*` branch and opens an
      # `automerge` PR (reward gate) instead of pushing to main. The full CI suite must
      # pass before anything lands — no more unvalidated direct-to-main commits.

      # GITHUB_TOKEN pushes/PRs never fire event-triggered workflows (recursion
      # guard), so the improver's PR would sit with NO CI forever — and since the
      # whole org rides CI completions, the perpetual-motion loop stalled every
      # night. Dispatching CI explicitly (allowed for GITHUB_TOKEN) closes the
      # loop: improver → PR → CI → gate merges → CI completion → next improver.
      - name: Dispatch CI on the improver branch (keeps the org loop alive)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(git -C . branch -r --list 'origin/improver/run-${{ github.run_id }}' --format='%(refname:short)' | sed 's|origin/||' | head -1)
          [ -z "$BRANCH" ] && BRANCH=$(gh pr list --author "github-actions[bot]" --state open --json headRefName --jq '.[0].headRefName' 2>/dev/null || true)
          if [ -n "$BRANCH" ]; then
            # continue-on-error stays (a lost dispatch must not discard the
            # improvements), but the failure must be VISIBLE. Bare `exit 1`
            # under continue-on-error renders as a green step, which is exactly
            # how a permanent 403 hid here for the workflow's whole lifetime.
            if gh workflow run test.yml --ref "$BRANCH"; then
              echo "CI dispatched on $BRANCH"
            else
              echo "::warning title=CI dispatch failed::Could not dispatch test.yml on $BRANCH. The PR will have NO CI run and the automerge gate cannot land it. Check that this job still grants actions:write."
            fi
          else
            echo "::warning title=No improver branch::Nothing to dispatch — the PR (if any) will have no CI run."
          fi

      - name: Post to step summary
        if: always()
        run: |
          echo "## Continuous Improvement Run" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran at: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/continuous_improvement_summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/continuous_improvement_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
