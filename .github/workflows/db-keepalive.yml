name: DB Keep-Alive

# Supabase free tier auto-pauses after 7 idle days — that pause took the whole
# site down on 2026-07-20 (every DB endpoint 500'd while /health stayed green).
# One cheap SELECT via the backend keeps the project active — AND this workflow
# carries the DB self-heal (region fix + pooler-cluster probe), so it runs
# HOURLY: GitHub delays/drops the newer db-url-region-autofix schedule by hours,
# and while Postgres is down we want the probe to retry every hour, not 3x/day.
# All steps are idempotent + fail-soft (no redeploy once the URL already works),
# so hourly execution is safe. Deploy smoke and watchdogs own alerting.

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17, offset to dodge top-of-hour congestion
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Belt-and-suspenders trigger for the DB region autofix. The standalone
      # db-url-region-autofix.yml schedule can take a while for GitHub to activate
      # after it's first committed; this workflow is already registered and fires
      # 3x/day, so it guarantees the fix runs. Idempotent — only redeploys when the
      # Render DATABASE_URL region actually changes, so on a correct URL it no-ops.
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fix DATABASE_URL region + probe pooler cluster (+ redeploy if changed)
        # Redundant trigger for the DB self-heal. db-url-region-autofix.yml owns
        # the same two scripts on its own 3h cron, but GitHub under-fires that
        # newer schedule, so this already-reliable workflow runs them too.
        # render_fix_db_url  → corrects a wrong pooler REGION (no-op once right).
        # render_probe_pooler → if the URL still won't connect, TESTS aws-0/aws-1
        #   × 6543/5432 with a real SELECT 1 and patches Render to a working host.
        # Both idempotent + fail-soft; only redeploy when they actually change it.
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_WORKER_SERVICE_ID }}
          SUPABASE_REGION: us-west-1
          SUPABASE_POOLER_PORT: "6543"
          SUPABASE_POOLER_PORTS: "6543,5432"
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "render creds absent — skipping db-url fix"; exit 0
          fi
          pip install httpx asyncpg --quiet
          python .github/scripts/render_fix_db_url.py || echo "db-url region fix failed (fail-soft)"
          python .github/scripts/render_probe_pooler.py || echo "pooler probe failed (fail-soft)"
      - name: Touch the database through the live backend
        run: |
          # /health/detailed runs SELECT 1 against the configured DATABASE_URL —
          # exactly the activity Supabase's idle detector counts.
          out=$(curl -sS --max-time 90 "https://quantedge-api-9jz0.onrender.com/health/detailed" || echo '{}')
          echo "$out" | python3 -c "
          import json,sys
          try:
              d = json.load(sys.stdin)
              db = d.get('checks', {}).get('database', {})
              print('database ok:', db.get('ok'), '| fallback:', db.get('fallback', 'none'),
                    '| primary err:', str(d.get('checks', {}).get('database_primary', {}).get('error', ''))[:120])
          except Exception as e:
              print('unparseable health response:', e)
          " || true
          echo "keep-alive ping sent"
