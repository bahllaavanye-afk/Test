name: Deploy on main

# The deploy job inside test.yml never fires: CI is dispatched on agent
# BRANCHES by the event chain — its newest run on branch=main is from May.
# This workflow hosts the deploy where it belongs: on: push to main. Anything
# reaching main already passed CI on its PR (reward gate), so deploying on
# push is safe. Same-commit dedupe, poll to live, page Discord on failure.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-on-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ensure SECRET_KEY is set on Render (else the app crashes at import)
        # ROOT CAUSE of the weeks-long update_failed loop (found 2026-07-19,
        # reproduced locally): app/config.py hard-raises at import if SECRET_KEY is
        # the placeholder/short while TRADING_MODE=paper — uvicorn then exits 1,
        # which Render reports as nonZeroExit:1 after a successful build. render.yaml
        # has generateValue:true but autoDeploy:false means that blueprint env was
        # never synced. This sets a secure value once (idempotent) so boot succeeds.
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SECRET_KEY_SECRET: ${{ secrets.SECRET_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "render creds absent — skip"; exit 0
          fi
          cur=$(curl -sS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/SECRET_KEY" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); v=d.get('envVar',d); print(v.get('value','') if isinstance(v,dict) else '')" 2>/dev/null || echo "")
          need=0
          case "$cur" in
            ""|"change-me-in-production-32-byte-hex"|"test-secret-key-32-bytes-hex-xxxxx") need=1 ;;
            *) [ "${#cur}" -lt 32 ] && need=1 ;;
          esac
          if [ "$need" = "1" ]; then
            val="${SECRET_KEY_SECRET:-$(python3 -c 'import secrets; print(secrets.token_hex(32))')}"
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/SECRET_KEY" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
              --data "{\"value\": $(printf '%s' "$val" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')}")
            echo "SECRET_KEY was unset/invalid on Render → set a secure value (HTTP $code)"
          else
            echo "SECRET_KEY already valid on Render (len ${#cur}) — nothing to do"
          fi

      - name: Trigger Render deploy and poll to live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "render creds absent — cannot deploy"; exit 1
          fi
          info=$(curl -sS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); x=(d[0].get('deploy',{}) if d else {}); print(x.get('commit',{}).get('id',''), x.get('status',''))" 2>/dev/null || echo "")
          last=$(printf '%s' "$info" | awk '{print $1}')
          last_status=$(printf '%s' "$info" | awk '{print $2}')
          # Only skip when this commit is ALREADY LIVE. A previous FAILED deploy of
          # the same commit must NOT block a re-deploy.
          if [ "$last" = "$GITHUB_SHA" ] && [ "$last_status" = "live" ]; then
            echo "newest deploy is already live at $GITHUB_SHA — nothing to do"; exit 0
          fi
          resp=$(curl -sS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}')
          id=$(printf '%s' "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" || true)
          [ -z "$id" ] && { echo "deploy trigger failed: $resp"; exit 1; }
          echo "deploy $id triggered — polling"
          for i in $(seq 1 60); do
            sleep 15
            st=$(curl -sS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$id" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" || echo "")
            echo "[$i] $st"
            case "$st" in
              live) echo "✓ deploy live"; exit 0 ;;
              build_failed|update_failed|canceled|deactivated) echo "✗ deploy $st"; exit 1 ;;
            esac
          done
          echo "✗ deploy timed out after 15m"; exit 1

      - name: Fetch Render failure events (diagnosis in CI log)
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "── Render service events (newest first) ──"
          curl -sS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/events?limit=20" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            | python3 -c "
          import json, sys
          for e in json.load(sys.stdin):
              ev = e.get('event', e)
              print(ev.get('timestamp',''), ev.get('type',''), '-', json.dumps(ev.get('details',{}))[:300])
          " || echo "(events fetch failed)"

      - name: Fetch Render APPLICATION logs (the real startup traceback)
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "── Render application logs (newest last) — the actual boot error ──"
          OWNER=$(curl -sS "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('ownerId',''))" 2>/dev/null || echo "")
          if [ -z "$OWNER" ]; then echo "(could not resolve ownerId — skipping app logs)"; exit 0; fi
          curl -sS -G "https://api.render.com/v1/logs" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            --data-urlencode "ownerId=$OWNER" \
            --data-urlencode "resource=$RENDER_SERVICE_ID" \
            --data-urlencode "limit=100" \
            --data-urlencode "direction=backward" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          logs = d.get('logs', []) if isinstance(d, dict) else d
          for l in reversed(logs):
              print(l.get('timestamp',''), l.get('message', l.get('text','')))
          " || echo "(app logs fetch failed — check Render dashboard → Logs)"

      - name: Page Discord on deploy failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" \
            --data "{\"content\": \"🚨 **Render deploy FAILED on main** — site still serves the previous build. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\", \"username\": \"QuantEdge Deploy\"}" || true
