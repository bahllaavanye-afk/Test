name: Desk Trading — Crypto 24/7 (Paper Orders)

# Crypto markets trade 24/7, but desk-trading.yml gates ALL desks to the US
# equity weekday window (*/15 9-22 * * 1-5). This additive workflow runs ONLY
# the crypto desk round the clock so the genuinely-always-on market is never idle.
# Equities/options/futures stay on desk-trading.yml (correct — those markets close).

on:
  # Cron starvation fix: desks ride CI completions (constant) — the script's
  # own market clock + top-K + no-position guards keep cadence safe.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/desk-trading-crypto-24x7.yml"
      - ".github/scripts/desk_order_placer.py"
  schedule:
    # Every 20 minutes, every day — crypto never closes. Off-:00 minute to avoid
    # the fleet-wide top-of-hour spike.
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

concurrency:
  group: desk-crypto
  cancel-in-progress: false

jobs:
  place-crypto-orders:
    # NOT on workflow_run. desk-trading.yml rides the SAME "CI completed"
    # event, has no market-hours gate of its own, and runs EVERY desk —
    # crypto included — around the clock. So on that trigger this job is pure
    # duplication, and because the two use different concurrency groups they
    # run in PARALLEL and compete for Alpaca's free-tier data limit.
    #
    # Measured 2026-07-28 06:46, both ignited by the same CI completion:
    #   desk-trading.yml          bars_fetched=70, all 20 crypto symbols
    #   desk-trading-crypto-24x7  bars_fetched=5   ← lost the race, 429s
    #
    # The crypto-only run was strictly worse AND was the thing degrading its
    # own twin. Its real value is the cron below, for stretches when CI is not
    # completing; on workflow_run it adds nothing to skip.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-desk-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-desk-

      - name: Install dependencies
        run: |
          pip install \
            pandas numpy scipy statsmodels scikit-learn \
            fastapi pydantic pydantic-settings \
            python-dotenv structlog tenacity anyio \
            python-jose[cryptography] passlib[bcrypt] cryptography slowapi \
            sqlalchemy[asyncio] httpx aiosqlite aiohttp \
            alpaca-py requests yfinance

      - name: Run crypto desk order placer (24/7)
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DESK_FILTER:       crypto
          TRADING_MODE:      paper
          # Hardcoded paper-trading key — not a production secret
          SECRET_KEY:        d70e4526f3a23417cf4b30afce4e5f2d827a9f33b56fc2ff665eeea2558ea1f1
          DATABASE_URL:      ""
          REDIS_URL:         ""
          PYTHONPATH:        ${{ github.workspace }}/backend
        run: python .github/scripts/desk_order_placer.py
