name: "Employee Conversations (hourly)"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: employee-conversations
  cancel-in-progress: false

jobs:
  employee-conversations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic langfuse 2>/dev/null || true

      - name: Run employee conversations
        run: python .github/scripts/employee_conversation_runner.py 2>&1 | tee /tmp/conv_output.txt
        continue-on-error: true
        env:
          # The repo's populated free-tier secrets are the `_1` variants — the
          # three workflows that demonstrably get LLM replies
          # (agent-status-check, multi-agent-discussion, claude-chat) all map
          # `secrets.GROQ_API_KEY_1` etc. This workflow mapped the UNSUFFIXED
          # names, which are empty, so it had no free provider at all.
          # `X_1 || X` takes whichever exists, so this cannot regress if the
          # unsuffixed secret is later populated.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_1 || secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_1 || secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEY_2: ${{ secrets.DEEPSEEK_API_KEY_2 }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY_1 || secrets.SAMBANOVA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_1 || secrets.CEREBRAS_API_KEY }}
          HYPERBOLIC_API_KEY: ${{ secrets.HYPERBOLIC_API_KEY_1 || secrets.HYPERBOLIC_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_AGENTS_API_KEYS: ${{ secrets.NVIDIA_AGENTS_API_KEYS }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY_1 || secrets.TOGETHER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ALLOW_PAID_APIS: "False"
          ANTHROPIC_API_KEY: "disabled"

      - name: Post run report to Discord
        run: |
          python - <<'PYEOF'
          import os, re, sys
          sys.path.insert(0, ".github/scripts")
          import notify

          output = ""
          try:
              with open("/tmp/conv_output.txt") as f:
                  output = f.read()
          except FileNotFoundError:
              pass

          responded = "0"
          failed_str = "none"
          m = re.search(r"RESPONDED_COUNT=(\d+)", output)
          if m:
              responded = m.group(1)
          m2 = re.search(r"FAILED_EMPLOYEES=(.+)", output)
          if m2 and m2.group(1).strip():
              failed_str = m2.group(1).strip()

          # Extract provider info (lines containing "via " pattern)
          providers = re.findall(r"\(via ([^)]+)\)", output)
          provider_summary = ", ".join(sorted(set(providers))) if providers else "see logs"

          # Discord markdown — Slack's "<url|label>" and ":emoji:" render as
          # literal text in Discord, so use a real emoji and a bare URL.
          run_url = (
              f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
              f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID', '')}"
          )
          text = (
              "👥 **Employee Conversations** — run complete\n"
              f"Responded: {responded}/47 employees\n"
              f"Providers used: {provider_summary}\n"
              f"Failed: {failed_str}\n"
              f"[View details →]({run_url})"
          )
          notify.post("#engineering", text, username="Employee Conversations")
          PYEOF
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_WORKFLOW: ${{ github.workflow }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/state/
          git diff --staged --quiet || git commit -m "chore(agents): hourly employee conversations $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" && git push origin HEAD
        continue-on-error: true

      - name: Open issue on failures
        run: |
          python - <<'PYEOF'
          import os, re
          output = ""
          try:
              with open("/tmp/conv_output.txt") as f:
                  output = f.read()
          except FileNotFoundError:
              pass
          m = re.search(r"FAILED_EMPLOYEES=(.+)", output)
          if m and m.group(1).strip():
              failed = [e for e in m.group(1).strip().split(",") if e.strip()]
              if len(failed) > 5:
                  import subprocess, sys
                  subprocess.run([sys.executable, ".github/scripts/free_agent_engineer.py"], check=False)
          PYEOF
        continue-on-error: true
