name: Fill Tracker — Strategy P&L Attribution

on:
  # Kept, but CANNOT be relied on. Measured 2026-07-29: this chained exactly
  # once in three hours despite many CI passes. Agent-branch CI is dispatched
  # by auto-pr.yml using GITHUB_TOKEN, and GitHub does not create new workflow
  # runs from GITHUB_TOKEN-triggered events — so `workflow_run` is suppressed
  # for precisely the branches that produce the fills. The one firing came from
  # the single CI run triggered by `pull_request` (a different actor). The cron
  # below is therefore the real schedule, not a fallback.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    # Every 6h, all week, 30 min AHEAD of the trimmer's "41 */6" so it reads
    # fresh attribution rather than yesterday's.
    #
    # Was "0 22 * * 1-5" — once a day, weekdays only — which starved every
    # consumer: the trimmer runs 4x a day EVERY day, so 3 of 4 runs read stale
    # data and every weekend run read data up to three days old, while the
    # crypto desks trade 24/7 and generate fills daily.
    #
    # The old cron was aligned to "after US market close + settlement buffer",
    # but this tracker only scores fills that are already >=24h old, so the
    # time of day cannot matter — the alignment bought nothing and cost the
    # consumers their input. Safe to run often: fills are de-duplicated by
    # `tracked_order_ids`, so a repeat run adds newly-matured fills only.
    - cron: "11 */6 * * *"
  workflow_dispatch:

concurrency:
  group: fill-tracking
  cancel-in-progress: false

# The tracker WRITES backend/performance_log/strategy_performance.json, but this
# workflow never committed it — and Actions runners are ephemeral, so the file was
# recomputed and thrown away on every run. Three consumers read that path and all
# three were therefore inert: strategy_trimmer.py (never retired anything),
# strategy_auto_tuner.py ("not found — no data to tune from"), and the desk's own
# trims lookup. Needs write access to persist it.
permissions:
  contents: write

jobs:
  track-fills:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run fill tracker
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADING_MODE:      "paper"
          ANTHROPIC_API_KEY: "disabled"
          ALLOW_PAID_APIS:   "False"
        run: |
          cd $GITHUB_WORKSPACE
          python .github/scripts/fill_tracker.py

      # Without this the attribution data never survives the runner. Mirrors the
      # commit step in strategy-trim.yml.
      - name: Persist strategy performance
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name  "quantedge-fill-bot"
          git config user.email "fill-bot@quantedge.local"
          if [ -f backend/performance_log/strategy_performance.json ] && \
             ! git diff --quiet -- backend/performance_log/strategy_performance.json; then
            git add backend/performance_log/strategy_performance.json
            git commit -m "chore(fills): update strategy P&L attribution [skip ci]"
            for i in 1 2 3 4; do git push origin HEAD:main && break || sleep $((2**i)); done
          else
            echo "No attribution changes."
          fi
