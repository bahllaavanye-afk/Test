name: Free Agent Engineer — autonomous issue fixing

# Fires when "agent-fix-needed" label is added to any issue, or every 4 hours,
# or manually via workflow_dispatch.  Uses only free LLMs (Gemini Flash → Groq).

on:
  issues:
    types: [labeled]   # fires when label "agent-fix-needed" is added
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:

jobs:
  fix:
    # Only run on label events when the right label was added; always run on
    # schedule / workflow_dispatch so the cron sweep catches any missed issues.
    if: >
      github.event_name != 'issues' ||
      github.event.label.name == 'agent-fix-needed'

    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet langfuse google-generativeai || true

      - name: Run free agent engineer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Full free cascade (not just gemini+groq) so a single provider outage
          # doesn't blank the brain — this is why issues errored "all providers failed".
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2:  ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY_1 }}
          CEREBRAS_API_KEY:  ${{ secrets.CEREBRAS_API_KEY_1 }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY_1 }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY_1 }}
          # Escalation tiers so a code fix never dies when free is exhausted:
          # free → OpenRouter (cheap open models) → Claude backstop (rare).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python .github/scripts/free_agent_engineer.py
