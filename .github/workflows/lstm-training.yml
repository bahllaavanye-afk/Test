name: LSTM Model Training (CPU — Weekly)

# Weekly CPU training on real OHLCV data (SPY + BTC daily, 3 years).
# Runtime: ~15-20 min on ubuntu-latest.
# Models saved as workflow artifacts (30-day retention) AND posted to Slack.
#
# ⚠️ THESE MODELS CANNOT CURRENTLY BE PROMOTED. Six weekly runs have succeeded
# and not one has ever reached inference. The recipe that used to sit here —
# "download the artifact, commit to backend/models_artifacts/<exp_name>/,
# InferenceService auto-loads on next deploy" — is wrong at every step:
#
#   · InferenceService reads the FLAT path models_artifacts/lstm_latest.pt.
#     It never recurses into <exp_name>/ and never looks for model.pt.
#   · AbstractModel.load() expects {"state_dict", "model_type", "metadata"}.
#     This script saves {"model_state_dict", "n_features", "hidden", ...},
#     so a correctly-NAMED file still raises KeyError.
#   · ci_lstm_trainer.LSTMPredictor and app.ml.models.lstm.LSTMPredictor are
#     DIFFERENT networks — the backend has a SelfAttention block this one
#     lacks, a 64-wide head against this one's 32, and returns logits where
#     this one returns sigmoid probabilities. load_state_dict() would fail on
#     the missing attention.* keys and on head.0.weight's shape.
#
# Promotion therefore needs the architectures unified first: this script should
# import and train app.ml.models.lstm.LSTMPredictor instead of defining a second
# network with the same name. .github/scripts/test_lstm_promotion_contract.py
# fails if promotion is wired up without that.

on:
  schedule:
    - cron: "0 2 * * 0"    # Every Sunday 02:00 UTC (off-hours, low runner demand)
  workflow_dispatch:        # Manual trigger for ad-hoc retraining

concurrency:
  group: lstm-training
  cancel-in-progress: true

jobs:
  train:
    name: Train LSTM (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PyTorch (CPU wheel is ~190 MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-torch-cpu-2.2

      - name: Install training dependencies
        run: |
          pip install --quiet \
            torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet \
            numpy yfinance requests

      - name: Verify environment
        run: |
          python -c "import torch, numpy, yfinance; print('Torch:', torch.__version__, '| NumPy:', numpy.__version__)"

      - name: Run LSTM training
        env:
          TRADING_MODE:      paper
          ANTHROPIC_API_KEY: "disabled"
          ALLOW_PAID_APIS:   "False"
          ARTIFACTS_DIR:     backend/models_artifacts
        run: python .github/scripts/ci_lstm_trainer.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lstm-models-${{ github.run_number }}
          path: backend/models_artifacts/
          retention-days: 30
