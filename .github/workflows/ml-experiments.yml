name: ML Experiments — weekly walk-forward training (CPU, free)

# torch can't fit on the 512MB Render dyno, so ML training lives here instead:
# a weekly scikit-learn walk-forward experiment on Actions CPU. Results go to
# the run's step summary and a rolling `ml-experiments-log` issue so they're
# durable and diffable week over week. Zero LLM spend — this is pure sklearn.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "17 4 * * 0"   # Sundays 04:17 UTC — results ready before Monday open
  workflow_dispatch: {}

permissions:
  # `read` until 2026-08-05, which was consistent with the script only ever
  # printing. It now writes .github/state/ml_experiments.json, and a history
  # that cannot be committed is the same ephemeral result in a new location.
  contents: write
  issues: write

concurrency:
  group: ml-experiments
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet numpy pandas scikit-learn httpx yfinance
      - name: Run walk-forward experiment
        id: run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python .github/scripts/ml_experiment.py | tee /tmp/ml_results.json
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-experiment-${{ github.run_id }}
          path: /tmp/ml_results.json
          retention-days: 90
      - name: Append to the rolling results issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="ml-experiments-log"
          n=$(gh issue list --search "in:title $title" --state open --json number \
                --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$n" ]; then
            n=$(gh issue create --title "$title" \
                  --body "Rolling log of weekly walk-forward ML experiment results. Each comment = one run." \
                  | grep -o '[0-9]*$')
          fi
          {
            echo "### Run $(date -u +%F) — [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo '```json'
            head -c 60000 /tmp/ml_results.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$n" --body-file /tmp/comment.md

      # The walk-forward numbers are the point of this workflow. Before this,
      # they existed only as stdout and as a comment on a rolling issue that
      # does not exist (checked 2026-08-05: 500 issues paged, no
      # `ml-experiments-log`), so every run's out-of-sample result was lost.
      - name: Commit the experiment history
        if: always()
        continue-on-error: true
        run: |
          git config user.email "ml-experiments@quantedge.ai"
          git config user.name "QuantEdge ML Experiments"
          git add -A .github/state/ml_experiments.json
          if ! git diff --cached --quiet; then
            git commit -m "ml: walk-forward results $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase --quiet origin main && git push origin HEAD:main && break || sleep $((i*2))
            done
          fi
