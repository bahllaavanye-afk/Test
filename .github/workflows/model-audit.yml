name: Model Audit — weekly LLM model-ID drift check

# Providers retire model IDs without notice and the free cascade then 404s
# quietly. Weekly: ask every provider for its live model list, compare against
# llm_common's configuration, and file an `agent-fix-needed` issue on drift —
# which the Monday claude-queue-worker then fixes. Self-healing loop, ~0 cost
# (list calls only, no inference).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "41 5 * * 6"   # Saturdays 05:41 UTC — issue ready for Monday's worker
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: model-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit configured model IDs against live catalogs
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY:  ${{ secrets.SAMBANOVA_API_KEY_1 }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          TOGETHER_API_KEY:   ${{ secrets.TOGETHER_API_KEY }}
          HYPERBOLIC_API_KEY: ${{ secrets.HYPERBOLIC_API_KEY }}
          NVIDIA_AGENTS_API_KEYS: ${{ secrets.NVIDIA_AGENTS_API_KEYS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUDIT_OUT: /tmp/model_audit.md
        run: python .github/scripts/model_audit.py
      - name: File an agent-fix-needed issue on drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -s /tmp/model_audit.md ]; then
            echo "No drift — nothing to file"; exit 0
          fi
          title="Model audit: configured LLM model IDs retired by provider"
          n=$(gh issue list --search "in:title \"$title\"" --state open --json number \
                --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file /tmp/model_audit.md
            echo "Updated existing issue #$n"
          else
            gh issue create --title "$title" --label agent-fix-needed \
              --body-file /tmp/model_audit.md
          fi
