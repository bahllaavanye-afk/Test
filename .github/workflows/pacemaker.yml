name: Pacemaker — keep the fleet alive without a human

# THE PROBLEM THIS SOLVES
#
# 36 workflows — every desk, company-brain, error-triage, continuous-improvement,
# employee-conversations — are chained off `workflow_run: workflows: ["CI"]`.
# CI (test.yml) triggers ONLY on `pull_request` and `workflow_dispatch`.
#
# So the entire fleet is downstream of somebody opening a PR. Cron cannot cover
# the gap: GitHub starves free-tier schedules under load, and it is measurable
# here — desk-trading-crypto is configured `7,27,47 * * * *` (3x/hour) and
# actually fired at 23:25, 01:05, 04:47, 08:39, 11:57. Gaps of 3.5 HOURS
# overnight, roughly 10% of its intended rate, while the same workflow ran
# near-hourly during the day when PRs were landing.
#
# Net effect, and exactly what was reported: "Discord is only active when this
# chat resumes." The fleet was downstream of a human pushing code.
#
# HOW THIS FIXES IT
#
# One long-lived job sleeps, then dispatches CI. CI completing re-triggers this
# workflow through workflow_run, which sleeps and dispatches again — a
# self-sustaining heartbeat that needs neither cron nor a person. `schedule`
# stays as a bootstrap in case the chain is ever broken; it is the backup here,
# not the mechanism.
#
# workflow_dispatch with GITHUB_TOKEN is GitHub's documented exception to the
# "a workflow's own token cannot trigger workflows" recursion guard —
# auto-pr.yml already relies on this and it demonstrably works (19 of the last
# 40 CI runs were dispatched by github-actions[bot]).

on:
  workflow_run:
    # CI is what this drives, but CI cannot be what STARTS it: CI runs only on
    # pull_request/workflow_dispatch, so a pacemaker keyed solely to CI needs a
    # PR to ignite — the exact dependency it exists to remove. Verified after
    # the first deploy: 0 pacemaker runs, because the only CI completion since
    # the merge was an `action_required` run that never executed.
    #
    # CORRECTION (measured after the first fix, from per-workflow run history —
    # the earlier claim here that these four "keep near-schedule time" and
    # ignite within 5-15 minutes was WRONG, drawn from a run-count sample that
    # said nothing about spacing):
    #
    #   signal-runner   (cron 5m):  13:29, 10:38, 06:51, 03:38, 23:58
    #   system-watchdog (cron 5m):  13:36, 10:58, 07:51, 04:01, 00:12
    #   quick-backtest  (cron 15m): 13:42, 10:56
    #
    # Free-tier cron here is UNIFORMLY degraded to roughly 3-hour spacing, for
    # every scheduled workflow, desks included. Nothing in this repo keeps time.
    #
    # This does not change the design, it changes the expected cold-start
    # latency: with five independently-phased sources at ~3h each, ignition is
    # expected in tens of minutes rather than hours, and worst case is ~3h.
    # What matters is that AFTER ignition the chain is self-sustaining and no
    # longer depends on cron at all — sleep 50m → dispatch CI on main → CI
    # completion re-triggers this workflow. Cron only ever has to fire once.
    #
    # Note the ignition sources must run ON MAIN: workflow_run does not fire for
    # upstream runs on other branches, so CI triggered by a pull_request cannot
    # start this. All four above run on main via schedule.
    workflows:
      - "CI"
      - "System Watchdog — Every 5 Minutes (Self-Healing)"
      - "Signal Runner — Every 5 Minutes (All Desks)"
      - "Quick Backtest Runner — Every 15 Minutes"
      - "Reward Gate — verifiable-reward auto-merge for agent PRs"
    types: [completed]
  schedule:
    - cron: "13 * * * *"      # last-resort bootstrap
  workflow_dispatch: {}

permissions:
  actions: write              # required to dispatch CI
  contents: read

# Exactly ONE pacemaker alive.
#
# This used to be `cancel-in-progress: true`, which made the workflow defeat
# itself. The job's shape is "sleep 3000s, THEN dispatch" — all of its value is
# in the last step. Upstream completions arrive here far more often than every
# 50 minutes (median 18 min across the sampled window: five ignition workflows
# plus CI, independently phased), and each arrival cancelled the sleeper before
# it ever reached the dispatch.
#
# Measured 2026-08-03 over the last 30 runs: 25 cancelled, 4 success, 1 running.
# Every cancelled run died short of the sleep — durations 0.1 to 47.9 minutes,
# never 50 — while all four successes took 50.4 minutes and delivered. The
# heartbeat ran at roughly half its intended rate, and the runs that "failed"
# did so as a green-looking `cancelled`, which no alert path watches.
#
# With `false`, GitHub keeps the in-progress run and parks the newest trigger as
# pending (superseding any older pending one), so at most one sleeper and one
# queued successor exist. The sleeper now always reaches its dispatch step.
# Pending runs consume no billable minutes.
concurrency:
  group: pacemaker
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Kill switch. Set repo variable PACEMAKER_DISABLED=true to stop the loop
      # without editing or deleting this file.
      - name: Check kill switch
        id: killswitch
        run: |
          if [ "${{ vars.PACEMAKER_DISABLED }}" = "true" ]; then
            echo "::warning::PACEMAKER_DISABLED is set — heartbeat stopped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The interval. 50 minutes gives roughly hourly cadence and stays well
      # inside the 75-minute job timeout, so a slow dispatch cannot orphan the
      # chain.
      - name: Wait out the interval
        if: steps.killswitch.outputs.run == 'true'
        run: sleep 3000

      - name: Dispatch CI to drive the 36 downstream workflows
        if: steps.killswitch.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/test.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" = "204" ]; then
            echo "✅ CI dispatched — fleet heartbeat delivered" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::CI dispatch failed (HTTP $code): $(cat /tmp/resp.txt)"
            echo "❌ heartbeat NOT delivered (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The merge gate needs a heartbeat for the SAME reason the fleet does.
      #
      # auto-merge.yml only ever evaluates the single PR whose event woke it: a
      # `pull_request_target` payload sets `context.payload.pull_request`, so
      # `candidates` gets one entry and the `candidates.size === 0` branch — the
      # one that scans ALL open PRs — never runs. Measured 2026-08-03 in run
      # 30782308923, whose entire output was one line about one PR while ~90
      # improver PRs sat open, at least one of them fully green.
      #
      # A `schedule` was added to auto-merge.yml for this, but 2h47m later it had
      # produced zero runs — consistent with the starvation this whole workflow
      # exists to route around (see the header: "GitHub starves free-tier
      # schedules under load"). Dispatching it here does not depend on cron.
      #
      # Deliberately does NOT `exit 1` on failure, unlike the CI dispatch above:
      # losing the merge sweep must not kill the fleet heartbeat, which is the
      # more load-bearing of the two. It still emits ::error:: so the failure is
      # visible — a silent skip here would be the same class of bug as the 403
      # that hid in continuous-improvement.yml for its whole lifetime.
      - name: Dispatch the merge gate (its own schedule is starved)
        if: steps.killswitch.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/am.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto-merge.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" = "204" ]; then
            echo "✅ merge gate dispatched — open PRs will be swept" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::auto-merge dispatch failed (HTTP $code): $(cat /tmp/am.txt)"
            echo "⚠️ merge sweep NOT dispatched (HTTP $code) — green PRs will keep piling up" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The trading desks are the reason the fleet exists, and they are the part
      # of it that cron has starved hardest.
      #
      # Both desk workflows declare `workflow_run: workflows: ["CI"]` on the
      # theory that they ride CI completions. Measured 2026-08-03 across their
      # last 30 runs each: desk-trading fired 28x schedule + 2x push, crypto 30x
      # schedule. ZERO workflow_run events on either. The anti-starvation trigger
      # they were given has never once delivered, so in practice the desks run on
      # the starved cron alone.
      #
      # What that costs, measured on desk-trading (cron "*/15 9-22 * * 1-5",
      # nominally 52 runs per weekday, 26 of them inside US regular trading
      # hours): 12 of the last 30 runs landed inside 13:30-20:00 UTC — 5 on Wed,
      # 4 on Thu, 3 on Fri, against a nominal 26 per day. Roughly 15% of intended
      # in-window cadence. Every out-of-window run generates real signals and
      # then discards all of them: run 30673525449 logged conf=1.00 on SLV, 1.00
      # on EPOL, 0.98 on EIDO, 0.80 on IWM and placed nothing, because
      # `desk_open = is_open or desk.always_open` was false at 23:44 UTC.
      #
      # Dispatching here is safe at any hour and needs no clock logic of its own:
      # desk_order_placer queries Alpaca's /v2/clock itself and skips non-
      # always_open desks when the market is shut, so an off-hours dispatch costs
      # one cheap signal-only run. Both desks set `cancel-in-progress: false` on
      # their own concurrency groups, so a dispatch that overlaps a cron run
      # queues rather than clobbering it.
      #
      # Like the merge gate above, a failure here must not abort the CI heartbeat,
      # so no `exit 1` — but it is reported rather than swallowed.
      - name: Dispatch the trading desks (their workflow_run trigger never fires)
        if: steps.killswitch.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in desk-trading.yml desk-trading-crypto-24x7.yml; do
            code=$(curl -sS -o /tmp/desk.txt -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/dispatches" \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then
              echo "✅ dispatched $wf" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$wf dispatch failed (HTTP $code): $(cat /tmp/desk.txt)"
              echo "⚠️ $wf NOT dispatched (HTTP $code) — desk falls back to starved cron" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # If the dispatch fails the chain dies silently, which is the exact class
      # of failure this repo keeps getting bitten by. Say so where it is seen.
      - name: Alert if the heartbeat broke
        if: failure()
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".github/scripts")
          try:
              from notify import post
              post("infra-alerts",
                   "🚨 **Pacemaker heartbeat FAILED** — CI was not dispatched, so the "
                   "36 workflows chained off it will not run until a PR lands. "
                   "The fleet is asleep.",
                   username="QuantEdge Pacemaker")
          except Exception as exc:
              print(f"alert failed: {exc}")
          PY
