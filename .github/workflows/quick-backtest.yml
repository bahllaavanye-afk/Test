name: Quick Backtest Runner — Every 15 Minutes

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Without this the GITHUB_TOKEN is read-only and the push at the end of every
# run 403s. Measured 2026-08-05: `git log --all -- .github/state/last_backtest.json`
# returns ZERO commits — this workflow has run every 15 minutes and has never
# once persisted a result.
permissions:
  contents: write

concurrency:
  group: quick-backtest
  cancel-in-progress: false

jobs:
  backtest:
    name: Run backtests across all desks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests numpy yfinance

      - name: Configure git
        run: |
          git config user.email "backtest@quantedge.ai"
          git config user.name "QuantEdge Backtest Runner"

      - name: Run backtests
        continue-on-error: true
        env:
          ALLOW_PAID_APIS: "False"
        run: python .github/scripts/quick_backtest_runner.py

      - name: Save results to state
        continue-on-error: true
        run: |
          if [ -f /tmp/quick_backtest_summary.json ]; then
            mkdir -p .github/state
            cp /tmp/quick_backtest_summary.json .github/state/last_backtest.json
          fi
          # Stage the WHOLE state dir, not just last_backtest.json.
          # quick_backtest_runner.py also writes agent_memory.json (line ~218),
          # which is tracked. Staging only one file left the other modified, so
          # the next step's `git pull --rebase` aborted with
          #   error: cannot pull with rebase: You have unstaged changes.
          # on all four retries, and nothing was ever pushed. The results were
          # computed correctly every 15 minutes and discarded every time.
          git add -A .github/state/
          git diff --cached --quiet || git commit -m "backtest: update results $(date -u +%H:%M) [skip ci]"

      - name: Push results
        continue-on-error: true
        run: |
          for i in 1 2 3 4; do
            git pull --rebase --quiet origin main && break || sleep $((i*2))
          done
          git push -u origin main || true

      - name: Step summary
        if: always()
        run: |
          echo "## Backtest Run — $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/quick_backtest_summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/quick_backtest_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
