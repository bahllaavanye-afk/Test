name: Run Experiments Agent

on:
  # GitHub drops/heavily delays free-tier cron, so `schedule` alone means this
  # never runs — which is exactly what happened: ML experiments had not run at
  # all, and the live service reports ml_models count 0. `workflow_run` events
  # are NOT dropped, so CI completions are the reliable heartbeat (same pattern
  # as oa-scout and model-audit). The gate step below keeps it to once a day
  # regardless of how often CI fires.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: run-experiments-agent
  cancel-in-progress: false

permissions:

  models: read   # free GitHub Models inference for the employee brains
  contents: write

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 10

    steps:
      # CI completes many times a day; ML experiments should not. Skip unless
      # the last SUCCESSFUL run of this workflow was over 20 hours ago. A manual
      # dispatch always runs.
      - name: Gate — at most one experiment run per day
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              print("run=true"); raise SystemExit
          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/"
              "run-experiments-agent.yml/runs?status=success&per_page=1",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          try:
              runs = json.load(urllib.request.urlopen(req, timeout=30))["workflow_runs"]
          except Exception as exc:
              print(f"::warning::gate lookup failed ({exc}) — running anyway")
              print("run=true"); raise SystemExit
          if not runs:
              print("run=true"); raise SystemExit          # never succeeded yet
          last = datetime.fromisoformat(runs[0]["created_at"].replace("Z", "+00:00"))
          age = datetime.now(timezone.utc) - last
          print(f"::notice::last successful experiment run {age} ago")
          print("run=true" if age > timedelta(hours=20) else "run=false")
          PY

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install --quiet langfuse litellm google-generativeai groq || true

      - name: Run experiments agent
        if: steps.gate.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          # Paid backstop: free-tier keys rate-limit silently; ai-pr-review proved
          # these work. Without them every conversation dies quiet (Discord silence).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_1 }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY_1 }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY_1 }}
          DEEPSEEK_API_KEY_2: ${{ secrets.DEEPSEEK_API_KEY_2 }}
          DEEPSEEK_API_KEY_3: ${{ secrets.DEEPSEEK_API_KEY_3 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_1 }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
          ALLOW_PAID_APIS: "False"
        run: python .github/scripts/agent_team.py --run-experiments
      - name: Push changes
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          git config user.email "agents@quantedge.ai"
          git config user.name "QuantEdge Agent Team"
          STATE_FILE=".github/state/agent_state.json"
          if [ -f "$STATE_FILE" ]; then
            git add "$STATE_FILE"
            git diff --cached --quiet || git commit -m "chore: persist agent state [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase --quiet origin main && break || sleep $((i*2))
            done
            git push -u origin main || true
          fi
