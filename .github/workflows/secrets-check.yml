name: Secrets & Config Health Check

# Verifies all required secrets are present and reports missing ones to Discord.
# Run this after adding secrets to confirm they're wired up correctly.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"     # Monday 8am UTC — weekly check

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install httpx
        run: pip install --quiet httpx

      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: "disabled"
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python3 << 'PYEOF'
          import os, httpx

          REQUIRED = {
              "DISCORD_BOT_TOKEN":   "Discord → discord.com/developers → Your App → Bot → Token",
              "RENDER_API_KEY":      "Render → Dashboard → Account Settings → API Keys",
              "RENDER_SERVICE_ID":   "Render → Service URL: dashboard.render.com/web/srv_XXXXXX",
              "ALPACA_API_KEY":      "Alpaca → app.alpaca.markets → API Keys",
              "ALPACA_SECRET_KEY":   "Alpaca → app.alpaca.markets → API Keys",
              "GOOGLE_CLIENT_ID":    "GCP → console.cloud.google.com → OAuth 2.0 Clients",
              "GOOGLE_CLIENT_SECRET":"GCP → console.cloud.google.com → OAuth 2.0 Clients",
          }

          missing = {}
          present = []
          for key, hint in REQUIRED.items():
              val = os.environ.get(key, "")
              if not val:
                  missing[key] = hint
              else:
                  present.append(key)

          print(f"✅ Present ({len(present)}): {', '.join(present)}")
          if missing:
              print(f"\n❌ Missing ({len(missing)}):")
              for k, hint in missing.items():
                  print(f"   {k}: {hint}")
          else:
              print("All required secrets are set!")

          # Post the result to Discord (Slack removed 2026-07-25 — this report
          # used to exit early whenever the Slack token was absent, which after
          # the quota died meant it was never delivered).
          import sys
          sys.path.insert(0, ".github/scripts")
          import notify

          if missing:
              lines = ["⚠️ **Missing GitHub Secrets** — some features will be disabled\n"]
              for k, hint in missing.items():
                  lines.append(f"• `{k}`: {hint}")
              lines.append("\nAdd at: Settings → Secrets and variables → Actions → New repository secret")
              msg = "\n".join(lines)
              channel = "infra-alerts"
          else:
              msg = f"✅ **All {len(present)} secrets configured** — QuantEdge fully operational"
              channel = "engineering"

          notify.post(channel, msg, username="Secrets Check")
          PYEOF
