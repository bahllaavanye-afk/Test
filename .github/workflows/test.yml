name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  # Catches the frontend-truncation failure class (RegimeIndicator/AppShell/
  # OptionsPCRPanel were each truncated by agents and only failed at Vercel —
  # whose free-tier deploy quota can exhaust). tsc+vite here makes a broken
  # frontend fail the PR deterministically, with no new dependencies.
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Build (tsc && vite)
        working-directory: frontend
        run: npm run build

  test-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No ref override: `ref: main` here meant this job NEVER tested the PR's
      # agent scripts — every PR was judged on main's code (and a red main
      # blocked every PR regardless of content). Found 2026-07-15 when a
      # test_desk_config.py fix "didn't apply" on its own PR.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv + pytest
        run: |
          pip install uv --quiet
          # pandas is needed by the desk bars-batch tests (desk_order_placer
          # builds OHLCV frames); pyyaml keeps other guards dependency-free.
          uv pip install --system pytest pytest-timeout pandas

      - name: Run agent script tests
        # All .github/scripts/test_*.py (slack agents, strategy gate/trimmer, and
        # the desk bars-batch regression that keeps the desks fed with data).
        run: python -m pytest .github/scripts/test_*.py -v --tb=short -x --timeout=30

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install uv
        run: pip install uv==0.5.6

      # CI-only dep list — fast install (<60s), no heavy ML libs (torch, ray, mlflow,
      # lightning, vectorbt, shap). Those are exercised in dedicated notebook/job
      # runs on GPU runners, not in unit-test CI.
      - name: Install runtime + test deps
        # Note: pandas-ta omitted — the project uses a pure-pandas shim
        # (app/ml/features/pandas_ta_compat.py), so the upstream package isn't needed.
        run: |
          uv pip install \
            'fastapi>=0.115.0' 'uvicorn[standard]>=0.32.0' 'websockets>=13.0' \
            'python-multipart>=0.0.12' 'slowapi>=0.1.9' \
            'sqlalchemy[asyncio]>=2.0.36' 'asyncpg>=0.30.0' 'alembic>=1.14.0' \
            'aiosqlite>=0.19.0' 'redis>=5.2.0' 'httpx>=0.27.2' \
            'pydantic[email]>=2.10.0' 'pydantic-settings>=2.6.0' 'email-validator>=2.0.0' \
            'python-jose[cryptography]>=3.3.0' 'passlib[bcrypt]>=1.7.4' \
            'cryptography>=43.0.0' 'bcrypt==4.0.1' \
            'numpy>=1.26.0' 'pandas>=2.2.0' 'scipy>=1.14.0' \
            'scikit-learn>=1.5.0' 'statsmodels>=0.14.0' \
            'structlog>=24.4.0' 'tenacity>=9.0.0' 'python-dotenv>=1.0.1' \
            'aiohttp>=3.11.0' 'anyio>=4.7.0' 'apscheduler>=3.10.4' \
            'pyyaml>=6.0' 'google-generativeai>=0.8.0' \
            'pytest>=8.3.0' 'pytest-asyncio>=0.24.0' 'pytest-xdist>=3.6.0' \
            'pytest-timeout>=2.3.0'

      - name: Debug — env + collect → write to PR summary (visible without auth)
        if: always()
        env:
          PYTHONPATH: "."
          SECRET_KEY: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          ALEMBIC_DATABASE_URL: "sqlite:///./test.db"
          REDIS_URL: ""
          TRADING_MODE: "test"
          ALPACA_API_KEY: "test"
          ALPACA_SECRET_KEY: "test"
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
        run: |
          {
            echo "## CI debug"
            echo ""
            echo "### Python"
            echo '```'
            python --version
            echo '```'
            echo ""
            echo "### Installed packages (60)"
            echo '```'
            pip list --format=columns | head -60
            echo '```'
            echo ""
            echo "### app.main import"
            echo '```'
            python -c "from app.main import app; print(f'OK: {len(app.routes)} routes')" 2>&1 || true
            echo '```'
            echo ""
            echo "### pytest --collect-only"
            echo '```'
            pytest tests/ --collect-only -q \
              --ignore=tests/unit/test_ml_models.py \
              --ignore=tests/unit/test_a3c_lstm.py 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests in parallel
        env:
          PYTHONPATH: "."
          SECRET_KEY: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          ALEMBIC_DATABASE_URL: "sqlite:///./test.db"
          REDIS_URL: ""
          TRADING_MODE: "test"
          ALPACA_API_KEY: "test"
          ALPACA_SECRET_KEY: "test"
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
        run: |
          set +e
          pytest tests/ \
            -n 4 --dist loadfile \
            --timeout=60 \
            --tb=short \
            --color=no \
            --ignore=tests/unit/test_ml_models.py \
            --ignore=tests/unit/test_a3c_lstm.py \
            -p no:cacheprovider \
            2>&1 | tee /tmp/pytest.log
          echo ${PIPESTATUS[0]} > /tmp/pytest.exitcode

      - name: Post debug output as PR comment (QuantEdge AI reads via MCP)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          {
            echo "## 🔍 CI debug — \`$(git rev-parse --short HEAD)\`"
            echo ""
            echo "### Python version"
            python --version
            echo ""
            echo "### Installed packages (head 50)"
            echo '```'
            pip list --format=columns 2>&1 | head -50
            echo '```'
            echo ""
            echo "### app.main import"
            echo '```'
            cd /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/backend
            PYTHONPATH=. SECRET_KEY=a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2 \
              DATABASE_URL=sqlite+aiosqlite:///./test.db ALEMBIC_DATABASE_URL=sqlite:///./test.db \
              REDIS_URL= TRADING_MODE=test ALPACA_API_KEY=test ALPACA_SECRET_KEY=test \
              ALPACA_BASE_URL=https://paper-api.alpaca.markets \
              python -c "from app.main import app; print(f'OK: {len(app.routes)} routes')" 2>&1 || true
            echo '```'
            echo ""
            echo "### pytest tail (last 120 lines)"
            echo '```'
            tail -120 /tmp/pytest.log 2>&1 || echo "(no pytest log)"
            echo '```'
            echo ""
            echo "_Exit code: $(cat /tmp/pytest.exitcode 2>/dev/null || echo unknown)_"
          } > /tmp/comment.md

          BODY=$(cat /tmp/comment.md | python -c "import sys, json; print(json.dumps(sys.stdin.read()))")
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUM/comments" \
            -d "{\"body\": $BODY}" \
            > /dev/null
          echo "✓ Posted debug comment to PR #$PR_NUM"

      - name: Fail if pytest failed
        if: always()
        run: |
          EXIT=$(cat /tmp/pytest.exitcode 2>/dev/null || echo 1)
          exit $EXIT

  # Event-driven ops sync — GitHub cron is starved in this repo (keep-alive at
  # */5 has hours-long gaps; the daily discord-sync NEVER fired), so critical
  # side-effects ride CI instead: CI fires reliably on every push/PR. Both
  # steps are idempotent; continue-on-error so this can never block a merge.
  ops-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Wake/keep the backend warm (cron keep-alive is starved)
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "health ping: HTTP %{http_code}\n" --max-time 120 \
            "https://quantedge-api-agb8.onrender.com/health" || true
      - name: Create Discord channels + register slash commands (idempotent)
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APP_ID: "1523285730384810034"
        run: |
          python .github/scripts/discord_setup_channels.py || true
          if [ -n "$DISCORD_BOT_TOKEN" ]; then
            curl -sS -o /dev/null -w "commands sync: HTTP %{http_code}\n" -X PUT \
              "https://discord.com/api/v10/applications/$APP_ID/commands" \
              -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json" \
              --data '[{"name":"status","type":1,"description":"QuantEdge bot fleet status"},{"name":"pnl","type":1,"description":"Equity and today'\''s paper P&L"},{"name":"health","type":1,"description":"Deep health: database, scheduler, API"},{"name":"run-bot","type":1,"description":"Evaluate one enabled bot now (paper)","options":[{"name":"name","description":"Part of the bot'\''s name","type":3,"required":true}]}]'
          fi
      - name: Relay runtime keys to Render (idempotent PUTs)
        continue-on-error: true
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_KEY_SECRET: ${{ secrets.POLYMARKET_KEY_SECRET }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_KEY_SECRET: ${{ secrets.KALSHI_KEY_SECRET }}
          TRADESTATION_CLIENT_ID: ${{ secrets.TRADESTATION_CLIENT_ID }}
          TRADESTATION_SECRET: ${{ secrets.TRADESTATION_SECRET }}
        run: |
          [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ] && { echo "render creds absent — skip"; exit 0; }
          # Non-secret but deploy-critical: the Google-login redirect target.
          # render.yaml sets it for blueprint syncs; this covers plain deploys.
          export FRONTEND_URL="https://quantedge-eight.vercel.app"
          for k in FRONTEND_URL DISCORD_BOT_TOKEN DISCORD_WEBHOOK_URL GOOGLE_SERVICE_ACCOUNT_JSON ALPACA_API_KEY ALPACA_SECRET_KEY OANDA_API_KEY OANDA_ACCOUNT_ID POLYMARKET_PRIVATE_KEY POLYMARKET_KEY_ID POLYMARKET_KEY_SECRET KALSHI_KEY_ID KALSHI_KEY_SECRET TRADESTATION_CLIENT_ID TRADESTATION_SECRET; do
            v="${!k}"
            [ -z "$v" ] && { echo "· $k not set — skip"; continue; }
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$k" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
              --data "{\"value\": $(printf '%s' "$v" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}")
            echo "$k → HTTP $code"
          done

  # ── Deploy to Render on green main ──────────────────────────────────────────
  # render.yaml sets autoDeploy: false, so merges NEVER reached the site — the
  # live backend sat on a weeks-old build (found 2026-07-18: 29/57 templates,
  # new endpoints 404, bot scheduler dead since Jul 5). This job closes the
  # loop: green CI on main -> POST a deploy -> poll to live -> page on failure.
  deploy:
    # CI has no `push` trigger — on main it runs via workflow_dispatch (the
    # event chain). Deploy on any non-PR green run of main; the same-commit
    # gate below stops redundant redeploys when CI re-runs on one commit.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, test-agents, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger Render deploy and poll to live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "render creds absent — cannot deploy"; exit 1
          fi
          # Same-commit gate: skip when the newest Render deploy already
          # built this SHA (chained CI can run several times per commit).
          last=$(curl -sS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print((d[0].get('deploy',{}) if d else {}).get('commit',{}).get('id',''))" || true)
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "newest deploy is already $GITHUB_SHA — nothing to do"; exit 0
          fi
          resp=$(curl -sS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}')
          id=$(printf '%s' "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" || true)
          [ -z "$id" ] && { echo "deploy trigger failed: $resp"; exit 1; }
          echo "deploy $id triggered — polling"
          for i in $(seq 1 60); do
            sleep 15
            st=$(curl -sS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$id" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" || echo "")
            echo "[$i] $st"
            case "$st" in
              live) echo "✓ deploy live"; exit 0 ;;
              build_failed|update_failed|canceled|deactivated) echo "✗ deploy $st"; exit 1 ;;
            esac
          done
          echo "✗ deploy timed out after 15m"; exit 1

      - name: Page Discord on deploy failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" \
            --data "{\"content\": \"🚨 **Render deploy FAILED on main** — the site is still serving the previous build. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\", \"username\": \"QuantEdge Deploy\"}" || true
